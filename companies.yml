# ===========================================================================
# THE COMPANIES YOU'RE WATCHING.  Edit this file, commit, push -> Railway
# redeploys and picks up the change automatically.
#
# Each entry needs a `name` and an `ats` (the platform hosting their careers
# page). To add a company, open their careers page and look at the URL:
#
#   job-boards.greenhouse.io/COMPANY   ->  ats: greenhouse   token: COMPANY
#   jobs.lever.co/COMPANY              ->  ats: lever        token: COMPANY
#   jobs.ashbyhq.com/COMPANY           ->  ats: ashby        token: COMPANY
#   jobs.smartrecruiters.com/COMPANY   ->  ats: smartrecruiters  token: COMPANY
#   apply.workable.com/COMPANY         ->  ats: workable     token: COMPANY
#   TENANT.wdN.myworkdayjobs.com/SITE  ->  ats: workday  token: TENANT
#                                          host: wdN     site: SITE
#
# Optional on any entry:
#   careers_url: https://...   the "browse all openings" link in your email.
#                              Defaults to the company's public board.
#
# Last resort for a company with no supported ATS:
#   - name: Some Co
#     ats: generic
#     url: https://someco.com/careers      # only works if not JavaScript-only
# ===========================================================================

